<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Filmes</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0f172a;
            color: #fff;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: #111827;
        }

        header h1 {
            font-size: 20px;
        }

        .buttons a {
            text-decoration: none;
            color: white;
            margin-left: 10px;
            padding: 8px 14px;
            border-radius: 6px;
            background: #3b82f6;
        }

        .buttons a:hover {
            background: #2563eb;
        }

        .hero {
            text-align: center;
            padding: 80px 20px;
        }

        .hero h2 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .hero p {
            color: #cbd5e1;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 40px;
        }

        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card h3 {
            margin-bottom: 10px;
        }

        .card p {
            font-size: 14px;
            color: #94a3b8;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #64748b;
        }
    </style>
</head>

<body>

<header>
    <h1>🎬 Catálogo de Filmes</h1>

    <div class="buttons">
        <a href="/views/login.html">Login</a>
        <a href="/views/cadastro.html">Cadastro</a>
    </div>
</header>

<section class="hero">
    <h2>Bem-vindo ao CineLog</h2>
    <p>Explore filmes, cadastre e gerencie seu catálogo.</p>
</section>
