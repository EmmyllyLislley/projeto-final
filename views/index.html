<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../public/index.css">
    <title>Catálogo de Filmes - CineLog</title>


</head>

<body>

<header>
    <h1>CINE<span>LOG</span></h1>
    <div class="buttons" id="botoes-autenticacao">
    </div>
</header>

<div class="sidebar">
        <h2>CINE<span>LOG</span></h2>
        <button class="btn-menu ativo" onclick="mudarAba('tela-filmes', this)">🎬 Filmes</button>
        <button class="btn-menu" onclick="mudarAba('tela-usuarios', this)">👤 Usuários</button>
        <button class="btn-menu" onclick="mudarAba('tela-diretores', this)">🎥 Diretores</button>
        <hr style="border-color: #1e2638; margin: 10px 0;">
        <button onclick="window.location.href='cadastro-filme.html'">➕ Novo Filme</button>
        <button onclick="window.location.href='cadastro-serie.html'">➕ Nova Série</button>
        <button onclick="window.location.href='cadastro-ator.html'">➕ Novo Ator</button>
        <button onclick="window.location.href='cadastro-diretor.html'">➕ Novo Diretor</button>
        <button onclick="window.location.href='gerencia-filmes.html'">Gerenciador (Filmes)</button>
        <button onclick="window.location.href='gerencia-series.html'">Gerenciador (Séries)</button>
        <button onclick="window.location.href='gerenciador.html'">Gerenciador (Gêneros e Atores)</button>

    </div>

    <section class="hero">
    <h2>Explore novas histórias</h2>
    <p>Seu gerenciador pessoal de cinema. Descubra títulos, organize suas listas e monte o catálogo perfeito de forma simples e intuitiva.</p>
</section>

    <div class="conteudo">
        
        <div id="tela-filmes" class="secao ativa">
            <h3>Filmes Cadastrados</h3>
            <div id="lista-filmes" style="margin-top:20px;">Carregando...</div>
        </div>
        

        <div id="tela-usuarios" class="secao">
            <h3>Lista de Usuários</h3>
            <table>
                <thead>
                    <tr><th>ID</th><th>E-mail</th></tr>
                </thead>
                <tbody id="lista-usuarios"></tbody>
            </table>
        </div>

        <div id="tela-diretores" class="secao">
            <h3>Lista de Diretores</h3>
            <table>
                <thead>
                    <tr><th>ID</th><th>Nome</th></tr>
                </thead>
                <tbody id="lista-diretores"></tbody>
            </table>
        </div>

    </div>



<footer>
    <p>© 2026 - CineLog</p>
</footer>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const token = localStorage.getItem("token");
        const containerBotoes = document.getElementById("botoes-autenticacao");

        if (token) {
            containerBotoes.innerHTML = `<a href="#" onclick="logout()" style="background: #ef4444;">Sair</a>`;
        } else {
            window.location.href = "login.html"; 
            containerBotoes.innerHTML = `
                <a href="login.html">Login</a>
                <a href="cadastro.html">Cadastro</a>
            `;
        }

        pegarFilmes();
        pegarUsuarios();
        pegarDiretores();
    });

    function logout() {
        localStorage.removeItem("token");
        window.location.reload(); 
    }

    function mudarAba(idDaTela, botaoClicado) {
        document.querySelectorAll('.secao').forEach(tela => tela.classList.remove('ativa'));
        document.querySelectorAll('.btn-menu').forEach(btn => btn.classList.remove('ativo'));
        document.getElementById(idDaTela).classList.add('ativa');
        botaoClicado.classList.add('ativo');
    }

    async function pegarFilmes() {
        try {
            const res = await fetch("http://localhost:3000/filmes");
            const dados = await res.json();
            const lista = dados.filmes || dados; // Trata se vier array direto ou objeto
            document.getElementById("lista-filmes").innerHTML = lista.map(f => `
                <p>• <b>${f.nome}</b> - ${f.duracao}</p>
            `).join('');
        } catch {
            document.getElementById("lista-filmes").innerText = "Erro ao carregar filmes.";
        }
    }

async function pegarUsuarios() {
    try {
        const token = localStorage.getItem("token"); // Pega a carteirinha
        
        const res = await fetch("http://localhost:3000/usuarios", {
            method: "GET",
            headers: {
                "Authorization": `Bearer ${token}` // Manda a carteirinha
            }
        });
        
        const dados = await res.json();
        
        if (!res.ok) {
            console.log("Erro do back:", dados);
            document.getElementById("lista-usuarios").innerHTML = `<tr><td colspan='2'>${dados.erro}</td></tr>`;
            return;
        }

        const lista = dados.usuarios || dados;
        document.getElementById("lista-usuarios").innerHTML = lista.map(u => `
            <tr>
                <td>#${u.id}</td>
                <td>${u.email}</td>
                <td><button onclick="deletarUsuario(${u.id})" style="background: red; color: white;">Excluir</button></td>
            </tr>
        `).join('');
    } catch (e) {
        document.getElementById("lista-usuarios").innerHTML = "<tr><td colspan='2'>Erro de conexão</td></tr>";
    }
}

    async function pegarDiretores() {
        try {
            const res = await fetch("http://localhost:3000/diretores");
            const dados = await res.json();
            const lista = dados.diretores || dados;
            document.getElementById("lista-diretores").innerHTML = lista.map(d => `
                <tr><td>#${d.id}</td><td>${d.nome}</td></tr>
            `).join('');
        } catch {
            document.getElementById("lista-diretores").innerHTML = "<tr><td colspan='2'>Erro ao carregar</td></tr>";
        }
    }
    async function deletarUsuario(id) {
    if (confirm("Deletar usuário?")) {
        await fetch(`http://localhost:3000/usuarios/${id}`, { 
            method: "DELETE" 
        });
        pegarUsuarios(); // Recarrega a lista
    }
}
</script>

</body>
</html>
