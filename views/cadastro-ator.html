<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Diretor - CineLog</title>
    <link rel="stylesheet" href = "../public/cadastro-diretor.css">

</head>
<script>
    // Se não tiver a chave (token) no bolso, é chutado para o login IMEDIATAMENTE
    if (!localStorage.getItem("token")) {
        window.location.href = "login.html";
    }
</script>
<body>

    <div class="container">
        <div class="header-area">
            <h1>CINE<span>LOG</span></h1>
            <p style="color: var(--texto-cinza); font-size: 14px; margin-top: 5px;">Novo Ator/Atriz</p>
        </div>

        <div class="input-group">
            <label for="nome">Nome do Ator/Atriz</label>
            <input type="text" id="nome" placeholder="Ex: Leonardo DiCaprio; Scarlett Johansson">
        </div>

        <button onclick="cadastrarAtor()">
            Cadastrar Ator/Atriz
        </button>

        <div class="link-voltar">
            <a href="index.html">← Voltar para a Página Inicial</a>
        </div>

        <p id="mensagem"></p>
    </div>

    <script>
        async function salvarAtor() {
            const id = document.getElementById("ator-id").value;
            const nome = document.getElementById("ator-nome").value;
            const metodo = id ? "PUT" : "POST";
            const rota = id ? `${API}/atores/${id}` : `${API}/atores`;

            await fetch(rota, {
                method: metodo,
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    nome: nome, 
                    dataNascimento: "1990-01-01", // Engana o backend
                    nacionalidade: "Desconhecida" // Engana o backend
                })
            });
            limparAtor(); listarAtores();
        }
    </script>
</body>
</html>
