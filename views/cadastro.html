<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Catálogo</title>
    <link rel="stylesheet" href="../public/cadastro.css">

</head>
<body>

    <div class="container">
        <div class="logo-area">
            <h1>CINE<span>LOG</span></h1>
        </div>

        <div class="input-group">
            <input
                type="text"
                id="nome"
                placeholder="Nome completo"
            >
        </div>

        <div class="input-group">
            <input
                type="text"
                id="username"
                placeholder="Nome de usuário (username)"
            >
        </div>

        <div class="input-group">
            <input
                type="email"
                id="email"
                placeholder="E-mail"
            >
        </div>

        <div class="input-group">
            <input
                type="password"
                id="senha"
                placeholder="Senha"
            >
        </div>

        <button onclick="cadastrar()">
            Cadastrar
        </button>

        <div class="link">
            <a href="login.html">
                Já possui conta? Fazer login
            </a>
        </div>

        <p id="mensagem"></p>
    </div>

    <script>
        async function cadastrar() {

            const nome =
                document.getElementById("nome").value;

            const username =
                document.getElementById("username").value;

            const email =
                document.getElementById("email").value;

            const senha =
                document.getElementById("senha").value;

            const mensagem =
                document.getElementById("mensagem");

   
            mensagem.className = "";

            try {

                const resposta = await fetch(
                    "http://localhost:3000/usuarios",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            nome,
                            username,
                            email,
                            senha
                        })
                    }
                );

                const dados = await resposta.json();

                if (resposta.ok) {

                    mensagem.classList.add("msg-sucesso");
                    mensagem.innerText =
                        "Usuário cadastrado com sucesso!";

                    document.getElementById("nome").value = "";
                    document.getElementById("username").value = "";
                    document.getElementById("email").value = "";
                    document.getElementById("senha").value = "";

                } else {

                    mensagem.classList.add("msg-erro");
                    mensagem.innerText =
                        dados.erro || "Erro ao cadastrar";
                }

            } catch (erro) {

                mensagem.classList.add("msg-erro");
                mensagem.innerText =
                    "Erro ao conectar com o servidor";

                console.error(erro);
            }
        }
    </script>

</body>
</html>
