<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Diretor - CineLog</title>
    <link rel="stylesheet" href = "../public/cadastro-diretor.css">

</head>
<script>
    // Se não tiver a chave (token) no bolso, é chutado para o login IMEDIATAMENTE
    if (!localStorage.getItem("token")) {
        window.location.href = "login.html";
    }
</script>
<body>

    <div class="container">
        <div class="header-area">
            <h1>CINE<span>LOG</span></h1>
            <p style="color: var(--texto-cinza); font-size: 14px; margin-top: 5px;">Novo Diretor</p>
        </div>

        <div class="input-group">
            <label for="nome">Nome do Diretor</label>
            <input type="text" id="nome" placeholder="Ex: Christopher Nolan">
        </div>

        <button onclick="cadastrarDiretor()">
            Cadastrar Diretor
        </button>

        <div class="link-voltar">
            <a href="index.html">← Voltar para a Página Inicial</a>
        </div>

        <p id="mensagem"></p>
    </div>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const token = localStorage.getItem("token");
        const containerBotoes = document.getElementById("botoes-autenticacao");

        if (token) {
            containerBotoes.innerHTML = `<a href="#" onclick="logout()" style="background: #ef4444;">Sair</a>`;
        } else {
            // Se não quiser que o sistema obrigue o login no teste, comente a linha abaixo:
            window.location.href = "login.html"; 
            containerBotoes.innerHTML = `
                <a href="login.html">Login</a>
                <a href="cadastro.html">Cadastro</a>
            `;
        }

        // Carrega os dados se não for redirecionado
        pegarFilmes();
        pegarUsuarios();
        pegarDiretores();
    });

    function logout() {
        localStorage.removeItem("token");
        window.location.reload(); 
    }

    function mudarAba(idDaTela, botaoClicado) {
        document.querySelectorAll('.secao').forEach(tela => tela.classList.remove('ativa'));
        document.querySelectorAll('.btn-menu').forEach(btn => btn.classList.remove('ativo'));
        document.getElementById(idDaTela).classList.add('ativa');
        botaoClicado.classList.add('ativo');
    }

    async function pegarFilmes() {
        try {
            const res = await fetch("http://localhost:3000/filmes");
            const dados = await res.json();
            const lista = dados.filmes || dados; // Trata se vier array direto ou objeto
            document.getElementById("lista-filmes").innerHTML = lista.map(f => `
                <p>• <b>${f.nome}</b> - ${f.duracao} min</p>
            `).join('');
        } catch {
            document.getElementById("lista-filmes").innerText = "Erro ao carregar filmes.";
        }
    }

    async function pegarUsuarios() {
        try {
            const res = await fetch("http://localhost:3000/usuarios");
            const dados = await res.json();
            const lista = dados.usuarios || dados;
            document.getElementById("lista-usuarios").innerHTML = lista.map(u => `
                <tr><td>#${u.id}</td><td>${u.email}</td></tr>
            `).join('');
        } catch {
            document.getElementById("lista-usuarios").innerHTML = "<tr><td colspan='2'>Erro ao carregar</td></tr>";
        }
    }

    async function pegarDiretores() {
        try {
            const res = await fetch("http://localhost:3000/diretores");
            const dados = await res.json();
            const lista = dados.diretores || dados;
            document.getElementById("lista-diretores").innerHTML = lista.map(d => `
                <tr><td>#${d.id}</td><td>${d.nome}</td></tr>
            `).join('');
        } catch {
            document.getElementById("lista-diretores").innerHTML = "<tr><td colspan='2'>Erro ao carregar</td></tr>";
        }
    }
</script>
</body>
</html>
