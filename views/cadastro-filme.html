<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Filme - CineLog</title>
    <link rel="stylesheet" href="../public/cadastro-filme.css">

</head>
<body>

    <div class="container">
        <div class="header-area">
            <h1>CINE<span>LOG</span></h1>
            <p style="color: var(--texto-cinza); font-size: 14px; margin-top: 5px;">Novo Filme</p>
        </div>

        <div class="input-group">
            <label for="nome">Título do Filme</label>
            <input type="text" id="nome" placeholder="Ex: Interestelar">
        </div>

        <div class="input-group">
            <label for="dataLancamento">Data de Lançamento</label>
            <input type="date" id="dataLancamento">
        </div>

        <div class="input-group">
            <label for="classificacao">Classificação Indicativa</label>
            <select id="classificacao">
                <option value="livre">Livre</option>
                <option value="10">10 anos</option>
                <option value="12">12 anos</option>
                <option value="14">14 anos</option>
                <option value="16">16 anos</option>
                <option value="18">18 anos</option>
            </select>
        </div>



        <div class="input-group">
            <label for="duracao">Duração (em minutos)</label>
            <input type="number" id="duracao" placeholder="Ex: 169" min="1">
        </div>

      <div class="input-group">
    <label for="idDiretor">Diretor</label>
    <select id="idDiretor"></select>
</div>

<div class="input-group">
    <label for="generos">Gêneros (Segure Ctrl para selecionar vários)</label>
    <select id="generos" multiple></select>
</div>
        <button onclick="cadastrarFilme()">
            Cadastrar Filme
        </button>

        <div class="link-voltar">
            <a href="index.html">
                ← Voltar para a Página Inicial
            </a>
        </div>

        <p id="mensagem"></p>
    </div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        carregarDiretores();
        carregarGeneros();
    });

    async function carregarDiretores() {
        const selectDiretor = document.getElementById("idDiretor");
        try {
            const res = await fetch("http://localhost:3000/diretores");
            const dados = await res.json();
            const diretores = dados.diretores || dados; // Garante o mapeamento se vier array direto
            selectDiretor.innerHTML = diretores.map(d => `<option value="${d.id}">${d.nome}</option>`).join('');
        } catch {
            selectDiretor.innerHTML = '<option value="">Erro ao carregar diretores</option>';
        }
    }

    async function carregarGeneros() {
        const selectGeneros = document.getElementById("generos");
        try {
            const resposta = await fetch("http://localhost:3000/generos");
            const dados = await resposta.json();
            const generos = dados.generos || dados;
            selectGeneros.innerHTML = generos.map(g => `<option value="${g.id}">${g.nome}</option>`).join('');
        } catch (err) {
            console.error("Erro ao buscar gêneros:", err);
            selectGeneros.innerHTML = '<option value="">Erro ao carregar gêneros</option>';
        }
    }

    async function cadastrarFilme() {
        const nome = document.getElementById("nome").value;
        const dataLancamento = document.getElementById("dataLancamento").value;
        const duracao = document.getElementById("duracao").value;
        const idDiretor = document.getElementById("idDiretor").value;
        const mensagem = document.getElementById("mensagem");
        const selectGeneros = document.getElementById("generos");
        const generosSelecionados = Array.from(selectGeneros.selectedOptions).map(option => parseInt(option.value));
        let classificacaoIndicativa = document.getElementById("classificacao").value;

        mensagem.className = "";
        mensagem.innerText = "";

        if (classificacaoIndicativa !== "livre") {
            classificacaoIndicativa = parseInt(classificacaoIndicativa);
        }

        const token = localStorage.getItem("token");

        try {
            const resposta = await fetch("http://localhost:3000/filmes", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify({
                    nome,
                    dataLancamento,
                    classificacaoIndicativa,
                    duracao: parseInt(duracao), 
                    idDiretor: parseInt(idDiretor),
                    generos: generosSelecionados
                })
            });

            const dados = await resposta.json();

            if (resposta.ok) {
                mensagem.className = "msg-sucesso";
                mensagem.innerText = dados.mensagem || "Filme cadastrado com sucesso!";
                document.getElementById("nome").value = "";
                document.getElementById("dataLancamento").value = "";
                document.getElementById("duracao").value = "";
            } else {
                mensagem.className = "msg-erro";
                mensagem.innerText = dados.erro || "Erro ao cadastrar o filme.";
            }
        } catch (erro) {
            mensagem.className = "msg-erro";
            mensagem.innerText = "Erro ao conectar com o servidor.";
        }
    }
</script>
</body>
</html>
